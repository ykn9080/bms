<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>EPMS Simulate</title>
<style>
  html, body { margin:0; height:100%; background:transparent; font-family:sans-serif; overflow:hidden; }
  #root { width:100%; height:100%; box-sizing:border-box; padding:6px; background:#22252b; color:#e0e0e0;
          display:flex; flex-direction:column; gap:6px; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ptitle { font-size:14px; font-weight:bold; color:#90a4ae; border-left:3px solid #546e7a; padding-left:5px; }
  select { background:#111827; color:#e5e7eb; border:1px solid #374151; border-radius:3px; font-size:13px; padding:3px 6px; max-width:200px; }
  .btns { flex:0 0 auto; display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-content:start; }
  .btn { height:28px; border:none; color:#fff; background:#1e88e5; font-weight:bold; font-size:14px; border-radius:5px; cursor:pointer;
  .btn:hover { filter:brightness(1.15); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.active { animation:blink .8s infinite; }
  @keyframes blink {
    0%, 100% { background:#dc2626; color:#fff; }
    50%      { background:#fbbf24; color:#111; }
  }
  .btn.reset { background:#047857; }

  #msg { font-size:12px; color:#90a4ae; min-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="root">
  <div class="head">
    <span class="ptitle">Simulate</span>
    <select id="target"></select>
  </div>

  <div class="btns">
    <button class="btn" data-scn="OVERCURRENT">과전류</button>
    <button class="btn" data-scn="VOLTAGE_SAG">전압강하</button>
    <button class="btn" data-scn="LOW_PF">역률저하</button>
    <button class="btn" data-scn="TRIP">ACB 트립</button>
    <button class="btn" data-scn="OPEN">차단기 열림</button>
    <button class="btn" data-scn="ALARM">경보</button>
    <button class="btn reset" id="recoverBtn"  style="background:#047857;">전체 복구</button>
  </div>

  <div id="msg"></div>
</div>

<script>
const API = "https://yknam.duckdns.org/nodered/epms";

const UNITS = {
  1:"수전반", 2:"변압기 1호", 3:"저압 주배전반", 4:"역률보상반", 5:"B1 기계실",
  6:"1층 로비", 7:"19층 분전반", 8:"20층", 9:"21층", 10:"22층", 11:"23층",
  12:"24층", 13:"25층", 14:"B2 주차장", 15:"B3 주차장"
};
const SCN = { OVERCURRENT:"과전류", VOLTAGE_SAG:"전압강하", LOW_PF:"역률저하",
              TRIP:"ACB 트립", OPEN:"차단기 열림", ALARM:"경보" };

const sel = document.getElementById("target");
const recoverBtn = document.getElementById("recoverBtn");
const msgEl = document.getElementById("msg");
const faultBtns = Array.from(document.querySelectorAll(".btn[data-scn]"));

sel.innerHTML = '<option value="all">전체</option>' +
  Object.entries(UNITS).map(([k,v]) => `<option value="${k}">${k}. ${v}</option>`).join("");

const style = document.createElement("style");
style.textContent = "@keyframes blink{0%,100%{background:#dc2626;color:#fff}50%{background:#fbbf24;color:#111}}";
document.head.appendChild(style);

// 대상(all 또는 unit 번호)별로 활성화된 이상 버튼을 기억한다. 원상복귀에 사용.
const activeBy = {};

const label = () => sel.value === "all" ? "전체" : UNITS[sel.value];

function render() {
  const set = activeBy[sel.value] || new Set();
  faultBtns.forEach(b => {
    const on = set.has(b.dataset.scn);
    b.style.animation = on ? "blink 0.8s infinite" : "";
    if (!on) b.style.background = "#1e88e5";
  });
  recoverBtn.textContent = sel.value === "all" ? "전체 복구" : "부분 복구";
  recoverBtn.style.background = "#047857";
}

async function callApi(path) {
  const r = await fetch(`${API}${path}`, { cache: "no-store" });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

async function fault(btn) {
  const scn = btn.dataset.scn;
  const key = sel.value;
  btn.disabled = true;
  msgEl.textContent = `${SCN[scn]} → ${label()} 전송 중...`;
  try {
    await callApi(`/inject?scenario=${scn}&unit=${key}`);
    if (!activeBy[key]) activeBy[key] = new Set();
    activeBy[key].add(scn);
    msgEl.textContent = `적용: ${SCN[scn]} (${label()})`;
  } catch (e) {
    msgEl.textContent = `실패: ${e.message}`;
  } finally {
    btn.disabled = false;
    render();
  }
}

async function recover() {
  const key = sel.value;
  recoverBtn.disabled = true;
  msgEl.textContent = `${key === "all" ? "전체" : "부분"} 복구 → ${label()} 전송 중...`;
  try {
    await callApi(`/inject?scenario=CLEAR&unit=${key}`);
    if (key === "all") {
      for (const k in activeBy) delete activeBy[k];
    } else {
      delete activeBy[key];
    }
    msgEl.textContent = `복구 완료: ${label()}`;
  } catch (e) {
    msgEl.textContent = `실패: ${e.message}`;
  } finally {
    recoverBtn.disabled = false;
    render();
  }
}
faultBtns.forEach(b => b.addEventListener("click", () => fault(b)));
recoverBtn.addEventListener("click", recover);

sel.addEventListener("change", () => { msgEl.textContent = ""; render(); });

render();
</script>
</body>
</html>
