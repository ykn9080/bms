services:
  # 1. PostgreSQL 설정 (백그라운드 전용)
  postgres:
    image: postgres:15-alpine
    container_name: iot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 💡 ports를 아예 제외하거나 아래처럼 내부 포트로만 바인딩하여 외부 노출을 차단합니다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - iot-network
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 1G

  # 2. InfluxDB 설정 (백그라운드 전용)
  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb_local
    user: "1000:1000"
    ports:
      - "127.0.0.1:8086:8086" # 내부 통신만 허용
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
      - ./influxdb_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORGANIZATION}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET_NAME}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=z61PBXtdd8WLJ3NpMa6zhVkjlBro-jqI9LbjI5eax50pnRijyOm-oI9ffAgaXtSzkUadk1yYfqMMmgGAoXHBBQ==
    restart: unless-stopped
    networks:
      - iot-network
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 1G

  # 3. Node-RED 설정 (백그라운드 전용)
  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: always
    ports:
      - "127.0.0.1:1880:1880" # 💡 외부 접속 차단, 내부 백그라운드 구동
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nodered_data:/data # 로컬에서 편집한 flows.json 등이 여기에 포함되어 복사됩니다.
    depends_on:
      - influxdb
      - postgres
# 💡 이 라인을 추가하면 컨테이너 기동 시 package.json의 패키지들을 자동 설치 후 노드레드를 실행합니다.
    command: >
      bash -c "npm install --prefix /data && ./usr/src/node-red/node-red.sh"
    networks:
      - iot-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # 4. Grafana 설정 (★유일하게 외부 전체 공개★)
  grafana:
    image: grafana/grafana:11.5.2
    container_name: iot-grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000" # 🌍 누구나 접속 가능하도록 완전 개방
    volumes:
      - ./grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_INSTALL_PLUGINS=influxdb,grafana-postgresql-datasource,yesoreyeram-infinity-datasource,marcusolsson-dynamictext-panel,cloudspout-button-panel
      - GF_SERVER_ROOT_URL=http://yknam.duckdns.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

      # 링크드인 공유용 익명 접속 설정
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
    depends_on:
      - postgres
      - influxdb
    networks:
      - iot-network

  # 💡 [신규 추가] 6. Nginx 리버스 프록시 서빙 (유일한 외부 창구)
  nginx:
    image: nginx:alpine
    container_name: iot-nginx
    restart: always
    # 사용자는 오직 이 포트(http://서버IP)를 통해서만 그라파나 대시보드를 보게 됩니다.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # 🌟 인증서 폴더 마운트 (읽기 전용)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - grafana
      - node-red
    networks:
      - iot-network
# 💡 pgadmin 서비스 섹션 및 미사용 볼륨 주석 전체 삭제 완료

networks:
  iot-network:
    driver: bridge
