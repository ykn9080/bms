  epms-modbus-sim:
    build: ./epms-modbus
    container_name: epms-modbus-sim
    stdin_open: true
    tty: true
    environment:
      - TZ=Asia/Seoul
      - MODBUS_PORT=502
      - CONTROL_PORT=8080
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    networks:
      - iot-network
#    networks:
#      iot-network
#        ipv4_address: 172.18.0.22
    restart: unless-stopped

  epms-modbus-collector:
    build: ./epms-modbus
    container_name: epms-modbus-collector
    command: ["python", "-u", "collector.py"]
    environment:
      - MODBUS_HOST=epms-modbus-sim
      - MODBUS_PORT=502
      - POLL_INTERVAL_S=5
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_COLLECTOR_TOKEN}
      - INFLUX_ORG=${INFLUXDB_ORGANIZATION}
      - INFLUX_BUCKET=node_red_bucket
      - PG_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      epms-modbus-sim:
        condition: service_started
      postgres:
        condition: service_healthy # wait until postgres ready
    networks:
      - iot-network
    restart: unless-stopped



networks:
  iot-network:
    driver: bridge
